<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตีซอมบี้ Present Progressive</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4c2;--card:#fff;--ink:#2b2350;--pri:#7c4dff;--bad:#ff4d4d;--sky:#8fe3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2250;--card:#3a2f6b;--ink:#fff6d6;--sky:#4b6fb8}}
:root[data-theme="dark"]{--bg:#2a2250;--card:#3a2f6b;--ink:#fff6d6;--sky:#4b6fb8}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Mali','Tahoma',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 0 rgba(0,0,0,.15);margin-bottom:14px}
h1{margin:0 0 4px;font-size:30px;text-align:center}h2{margin:0 0 10px}
.sub{text-align:center;opacity:.8;margin-bottom:14px}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:14px;border:3px solid #b9a7ff;font:inherit;font-size:17px;background:var(--card);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:18px;padding:13px 22px;background:var(--pri);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer;margin-top:12px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
button.green{background:#1fa95b}button.orange{background:#ff8a1f}button.ghost{background:#8b83b8}
.full{width:100%}.hide{display:none!important}.center{text-align:center}
.hud{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:18px;margin-bottom:8px}
.hud span{background:var(--card);padding:6px 12px;border-radius:14px}
.bar{height:12px;background:rgba(0,0,0,.15);border-radius:8px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5e5e,#ffd23f);width:100%;transition:width 1s linear}
.q{background:#fff;color:#2b2350;border:4px solid var(--pri);border-radius:20px;padding:14px;text-align:center;font-size:clamp(22px,5.5vw,34px);font-weight:700;margin-bottom:10px}
.q b{color:#e8318a;border-bottom:4px dashed #e8318a;padding:0 10px}
.field{position:relative;background:linear-gradient(var(--sky) 0 25%,#7ed957 25%);border-radius:22px;padding:14px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px}
.field.shake{animation:sh .35s;background:linear-gradient(#ff8c8c 0 25%,#ff5e5e 25%)}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.hole{position:relative;height:150px;overflow:hidden}
.dirt{position:absolute;bottom:0;left:6%;right:6%;height:34px;background:#5b3a1e;border-radius:50%;box-shadow:inset 0 8px 0 #3b2412;z-index:3}
.z{position:absolute;bottom:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;transform:translateY(120%);transition:transform .28s cubic-bezier(.3,1.6,.5,1);z-index:2;cursor:pointer;user-select:none;touch-action:manipulation}
.z.up{transform:translateY(0)}
.z.hit{transform:translateY(120%);transition:transform .15s}
.word{background:#fff;color:#2b2350;border:3px solid #2b2350;border-radius:14px;padding:2px 10px;font-weight:700;font-size:clamp(17px,4.6vw,26px);margin-bottom:-4px;z-index:2;white-space:nowrap}
.z svg{width:78px;height:78px}
.spark{position:absolute;pointer-events:none;font-size:26px;z-index:9;animation:sp .8s forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.3) rotate(200deg);opacity:0}}
.pts{position:absolute;pointer-events:none;font-weight:700;font-size:30px;z-index:9;animation:fl .8s forwards}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.big{font-size:60px;font-weight:700;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:16px}th,td{padding:8px;border-bottom:2px solid rgba(124,77,255,.25);text-align:left}
th{background:rgba(124,77,255,.18)}.scroll{overflow-x:auto}
.note{font-size:14px;opacity:.75}
</style></head><body><main>

<section id="login" class="card">
<h1>🧟 ตีซอมบี้ Present Progressive</h1>
<div class="sub">เลือกคำตอบที่ถูกต้อง แล้วตีซอมบี้ให้ได้!</div>
<label>โรงเรียน</label><select id="school"></select>
<div class="row"><div><label>ชื่อ</label><input id="fn"></div><div><label>นามสกุล</label><input id="ln"></div></div>
<div class="row"><div><label>ชั้นเรียน (เช่น ป.5/1)</label><input id="cls"></div><div><label>เลขที่</label><input id="no" inputmode="numeric"></div></div>
<div id="err" class="note" style="color:var(--bad)"></div>
<button class="full green" id="goStart">🎮 เข้าสู่เกม</button>
<button class="full ghost" id="goTeacher">👩‍🏫 สำหรับครู: ดูคะแนน</button>
</section>

<section id="menu" class="card hide center">
<h1>สวัสดี <span id="hi"></span>!</h1>
<div class="sub">คะแนนเต็ม 10 (ด่าน 1 = 5 | ด่าน 2 = 5) · ด่านละ 120 วินาที · ตีถูก +10 ตีผิด −5</div>
<div class="note" id="last"></div>
<button class="full green" id="s1">▶ ด่านที่ 1: ซอมบี้ในภาพ (12 ข้อ)</button>
<button class="full orange hide" id="s2">⚔ ด่านที่ 2: บอสซูเปอร์วายร้าย (10 ประโยค)</button>
<div class="note" id="lockNote">ต้องผ่านด่านที่ 1 ก่อน (ตอบถูกอย่างน้อย 6 จาก 12 ข้อ) จึงจะเลือกด่านที่ 2 ได้</div>
<button class="ghost" id="logout">ออก</button>
</section>

<section id="game" class="hide">
<div class="hud"><span id="lv"></span><span>⏱ <b id="time">120</b></span><span>⭐ <b id="score">0</b></span><span id="prog"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="q" id="q"></div>
<div class="field" id="field"></div>
</section>

<section id="result" class="card hide center">
<h2 id="rt"></h2><div class="big" id="rs"></div><div id="rd"></div>
<button class="full orange hide" id="to2">⚔ ไปด่านที่ 2</button>
<button class="full green" id="again">🔁 เล่นใหม่</button>
<button class="full ghost" id="toMenu">หน้าเมนู</button>
</section>

<section id="teacher" class="card hide">
<h2>👩‍🏫 คะแนนนักเรียน</h2>
<label>เลือกโรงเรียน</label><select id="tschool"><option value="">-- เลือกโรงเรียน --</option></select>
<div id="tbl" class="scroll" style="margin-top:10px"></div>
<button class="ghost" id="tback">← กลับ</button>
</section>
</main>
<script>
const SCHOOLS=["โรงเรียนสารสาสน์วิเทศสุวรรณภูมิ","โรงเรียนสารสาสน์วิเทศสุราษฎร์ธานี","โรงเรียนสารสาสน์วิเทศชลบุรี","โรงเรียนสารสาสน์วิเทศบูรพา","โรงเรียนสารสาสน์วิเทศเพชรบุรี","โรงเรียนสารสาสน์วิเทศน์ออนซี"];
const L1=[
["The clowns ___ laughing.","are",["is","am","isn't"]],
["Dad is ___ a hot dog.","eating",["roaring","crying","flying"]],
["The lion is ___.","roaring",["clapping","standing","drinking"]],
["The seal is ___ with a ball.","playing",["riding","brushing","lying"]],
["The crowd ___ clapping.","is",["are","am","aren't"]],
["The elephant is ___ on two legs.","standing",["flying","crying","eating"]],
["The baby is ___.","crying",["laughing","riding","roaring"]],
["The man is ___ a kite.","flying",["playing","lying","drinking"]],
["The zebras ___ drinking water.","are",["is","am","isn't"]],
["The family is ___ their bikes.","riding",["brushing","eating","clapping"]],
["The old man is ___ on the sofa.","lying",["standing","flying","roaring"]],
["The family members ___ brushing their teeth.","are",["is","am","isn't"]]];
const L2=[
["She ___ wearing a blue dress.","is",["are","am","isn't"]],
["They ___ eating ice cream.","are",["is","am","isn't"]],
["I ___ doing my homework now.","am",["is","are","aren't"]],
["Nick and I ___ shopping for new clothes.","are",["is","am","isn't"]],
["It ___ raining today.","isn't",["aren't","am not","don't"]],
["I ___ learning German.","am not",["isn't","aren't","not am"]],
["The two boys ___ painting a picture.","aren't",["isn't","am not","doesn't"]],
["___ you sleeping?","Are",["Is","Am","Do"]],
["Is the sun shining? Yes, it ___.","is",["are","am","does"]],
["Where ___ they going?","are",["is","am","do"]]];
const $=id=>document.getElementById(id);
let me=null,lvl=1,items=[],qi=0,score=0,right=0,left=120,tick=null,popT=null,live=false,res={1:null,2:null},db=null;
const show=id=>{["login","menu","game","result","teacher"].forEach(s=>$(s).classList.toggle("hide",s!==id))};
SCHOOLS.forEach(s=>{$("school").add(new Option(s,s));$("tschool").add(new Option(s,s))});
(async()=>{try{db=await claude.use("db")}catch(e){db=null}})();
const sid=m=>[m.school,m.cls,m.no,m.fn,m.ln].join("_").replace(/[\/\\\s.#?'"]+/g,"-").slice(0,190);
function lsGet(){try{return JSON.parse(localStorage.getItem("zh_scores")||"{}")}catch(e){return{}}}
async function save(rec){let ok=false;
 if(db){try{await db.collection("scores").doc(sid(rec)).set(rec);ok=true}catch(e){}}
 try{const a=lsGet();a[sid(rec)]=rec;localStorage.setItem("zh_scores",JSON.stringify(a))}catch(e){}
 return ok}
async function load(school){let rows=[];
 if(db){try{const s=await db.collection("scores").where("school","==",school).get();rows=s.docs.map(d=>d.data())}catch(e){}}
 if(!rows.length){rows=Object.values(lsGet()).filter(r=>r.school===school)}
 return rows}
let ac;const snd=(f,d,t="sine",v=.2,when=0)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+when;g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}};
const sOK=()=>{snd(660,.15,"triangle");snd(880,.15,"triangle",.2,.1);snd(1320,.25,"triangle",.2,.2)};
const sBAD=()=>{snd(150,.3,"sawtooth",.25);snd(100,.3,"square",.15,.1)};
$("goStart").onclick=()=>{const m={school:$("school").value,fn:$("fn").value.trim(),ln:$("ln").value.trim(),cls:$("cls").value.trim(),no:$("no").value.trim()};
 if(!m.fn||!m.ln||!m.cls||!m.no){$("err").textContent="กรุณากรอกข้อมูลให้ครบทุกช่อง";return}
 $("err").textContent="";me=m;res={1:null,2:null};openMenu()};
$("goTeacher").onclick=()=>show("teacher");$("tback").onclick=()=>show("login");$("logout").onclick=()=>show("login");
const total=()=>(res[1]?res[1].s:0)+(res[2]?res[2].s:0);
function openMenu(){$("hi").textContent=me.fn;const p=res[1]&&res[1].pass;
 $("s2").classList.toggle("hide",!p);$("lockNote").classList.toggle("hide",!!p);
 $("last").textContent=(res[1]||res[2])?"คะแนนรอบนี้: "+total()+" / 10":"";show("menu")}
$("s1").onclick=()=>start(1);$("s2").onclick=()=>start(2);$("to2").onclick=()=>start(2);
$("again").onclick=()=>start(lvl);$("toMenu").onclick=openMenu;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function zombieSVG(){const c=["#7ed957","#9be564","#6fcf97"][Math.random()*3|0];return `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="38" fill="${c}" stroke="#2b2350" stroke-width="4"/><path d="M20 30q10-18 30-10 18-10 30 10" fill="#5a3b8c" stroke="#2b2350" stroke-width="4"/><circle cx="36" cy="50" r="10" fill="#fff" stroke="#2b2350" stroke-width="3"/><circle cx="64" cy="50" r="10" fill="#fff" stroke="#2b2350" stroke-width="3"/><circle cx="38" cy="52" r="4" fill="#2b2350"/><circle cx="62" cy="52" r="4" fill="#2b2350"/><path d="M34 72q16 14 32 0" fill="#fff" stroke="#2b2350" stroke-width="3"/><path d="M44 74v6M56 74v6" stroke="#2b2350" stroke-width="3"/><path d="M72 28l8 6" stroke="#c0392b" stroke-width="4"/></svg>`}
function build(){const f=$("field");f.innerHTML="";for(let i=0;i<6;i++){const h=document.createElement("div");h.className="hole";h.innerHTML=`<div class="z"><div class="word"></div>${zombieSVG()}</div><div class="dirt"></div>`;f.appendChild(h)}
 f.querySelectorAll(".z").forEach(z=>z.addEventListener("pointerdown",e=>{e.preventDefault();whack(z,e)}))}
function start(l){lvl=l;items=shuf(l===1?L1:L2);qi=0;score=0;right=0;left=120;live=true;
 $("lv").textContent=l===1?"ด่าน 1":"ด่าน 2 ⚔";$("score").textContent=0;$("time").textContent=120;$("bar").style.transition="none";$("bar").style.width="100%";
 build();show("game");nextQ();clearInterval(tick);clearTimeout(popT);
 setTimeout(()=>{$("bar").style.transition="width 1s linear"},50);
 tick=setInterval(()=>{left--;$("time").textContent=left;$("bar").style.width=(left/120*100)+"%";if(left<=0)end()},1000);pop()}
function nextQ(){if(qi>=items.length){end();return}const it=items[qi];
 $("q").innerHTML=it[0].replace("___","<b>?</b>");$("prog").textContent=(qi+1)+"/"+items.length;
 document.querySelectorAll(".z").forEach(z=>{z.classList.remove("up");z.dataset.w=""})}
function pop(){if(!live)return;const it=items[qi];if(!it)return;
 const zs=[...document.querySelectorAll(".z")];const free=zs.filter(z=>!z.classList.contains("up"));
 if(free.length){const z=shuf(free)[0];
  const hasCorrect=zs.some(x=>x.classList.contains("up")&&x.dataset.w===it[1]);
  const w=(!hasCorrect&&Math.random()<.55)?it[1]:shuf(it[2])[0];
  z.dataset.w=w;z.querySelector(".word").textContent=w;z.classList.remove("hit");z.classList.add("up");
  const q=qi;setTimeout(()=>{if(qi===q)z.classList.remove("up")},1700+Math.random()*900)}
 popT=setTimeout(pop,520+Math.random()*380)}
function fx(txt,good,ev){const f=$("field");const r=f.getBoundingClientRect();const x=ev.clientX-r.left,y=ev.clientY-r.top;
 const p=document.createElement("div");p.className="pts";p.textContent=txt;p.style.cssText=`left:${x-20}px;top:${y-30}px;color:${good?"#1fa95b":"#e11d1d"}`;f.appendChild(p);setTimeout(()=>p.remove(),800);
 if(good){for(let i=0;i<10;i++){const s=document.createElement("div");s.className="spark";s.textContent=["⭐","✨","🌟"][i%3];s.style.cssText=`left:${x}px;top:${y}px;--x:${(Math.random()-.5)*160}px;--y:${(Math.random()-.5)*160}px`;f.appendChild(s);setTimeout(()=>s.remove(),800)}}
 else{f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");setTimeout(()=>f.classList.remove("shake"),400)}}
function whack(z,ev){if(!live||!z.classList.contains("up"))return;const it=items[qi];
 if(z.dataset.w===it[1]){score+=10;right++;sOK();fx("+10",true,ev);z.classList.add("hit");qi++;$("score").textContent=score;setTimeout(nextQ,350)}
 else{score=Math.max(0,score-5);sBAD();fx("−5",false,ev);z.classList.remove("up");$("score").textContent=score}}
async function end(){if(!live)return;live=false;clearInterval(tick);clearTimeout(popT);
 const n=items.length,pts=Math.round(right/n*5),pass=lvl===1?right>=6:true;
 res[lvl]={s:pts,pts:score,right:right,pass:pass};
 $("rt").textContent=left<=0?"⏰ หมดเวลา!":"🎉 ตอบครบทุกข้อ!";
 $("rs").textContent=score+" คะแนน";
 $("rd").innerHTML=`ตอบถูก ${right}/${n} ข้อ · ได้ ${pts}/5 คะแนนสะสม<br>รวมทั้งเกม: <b>${total()} / 10</b>`+(lvl===1&&!pass?"<br>ต้องตอบถูกอย่างน้อย 6 ข้อเพื่อไปด่านที่ 2":"")+'<div class="note" id="sv">กำลังบันทึก...</div>';
 $("to2").classList.toggle("hide",!(lvl===1&&pass));show("result");
 const ok=await save({...me,score:total(),l1:res[1]?res[1].s:0,l2:res[2]?res[2].s:0,l1pts:res[1]?res[1].pts:0,l2pts:res[2]?res[2].pts:0,at:new Date().toISOString()});
 $("sv").textContent=ok?"✅ บันทึกคะแนนล่าสุดแล้ว":"✅ บันทึกในเครื่องนี้แล้ว"}
$("tschool").onchange=async()=>{const s=$("tschool").value,t=$("tbl");if(!s){t.innerHTML="";return}
 t.textContent="กำลังโหลด...";const rows=await load(s);
 if(!rows.length){t.textContent="ยังไม่มีคะแนนของโรงเรียนนี้";return}
 rows.sort((a,b)=>String(a.cls||"").localeCompare(String(b.cls||""),'th',{numeric:true})||(+a.no)-(+b.no));
 const e=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 t.innerHTML=`<table><tr><th>ชั้น</th><th>เลขที่</th><th>ชื่อ-สกุล</th><th>ด่าน 1</th><th>ด่าน 2</th><th>รวม /10</th><th>เวลา</th></tr>`+rows.map(r=>`<tr><td>${e(r.cls)}</td><td>${e(r.no)}</td><td>${e(r.fn)} ${e(r.ln)}</td><td>${e(r.l1)}/5</td><td>${e(r.l2)}/5</td><td><b>${e(r.score)}</b></td><td>${r.at?new Date(r.at).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"}):""}</td></tr>`).join("")+"</table>"};
</script></body></html>
